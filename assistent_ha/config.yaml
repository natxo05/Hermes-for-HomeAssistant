name: Hermes
version: "0.1.0"
slug: assistent_ha
description: Hermes, assistent personal per Telegram (text i veu) amb Gemini i accions a Home Assistant
url: https://github.com/natxo05/Hermes-for-HomeAssistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy-outline
panel_title: Hermes
watchdog: http://[HOST]:[PORT:8099]/health
# Si publiques la imatge amb GitHub Actions (recomanat), descomenta la línia
# següent perquè Home Assistant la descarregui en lloc de compilar-la al dispositiu.
# image: "ghcr.io/natxo05/hermes"
options:
  telegram_token: ""
  allowed_user_ids: []
  gemini_api_key: ""
  gemini_model: gemini-2.5-flash
  whisper_model: small
  whisper_compute_type: int8
  language: ca
  shopping_list_entity: todo.shopping_list
  calendar_entity: calendar.personal
  timezone: ""
  max_history_turns: 12
  confirm_domains:
    - lock
    - alarm_control_panel
    - cover
  startup_message: true
  debug: false
schema:
  telegram_token: password
  allowed_user_ids:
    - int
  gemini_api_key: password
  gemini_model: str
  whisper_model: list(tiny|base|small|medium|large-v3)
  whisper_compute_type: list(int8|int8_float32|float32)
  language: str
  shopping_list_entity: str
  calendar_entity: str
  timezone: str
  max_history_turns: int(0,50)
  confirm_domains:
    - str
  startup_message: bool
  debug: bool
