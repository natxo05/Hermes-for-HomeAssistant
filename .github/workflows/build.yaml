name: Build add-on image

on:
  push:
    branches:
      - main
      - master
    paths:
      - "assistent_ha/app/**"
      - "assistent_ha/Dockerfile"
      - "assistent_ha/requirements.txt"
      - "assistent_ha/config.yaml"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hermes

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.meta.outputs.image_name }}
      registry_prefix: ${{ steps.meta.outputs.registry_prefix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the version from config.yaml
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' assistent_ha/config.yaml | head -n1)
          if [[ -z "${version}" ]]; then
            echo "::error::No he pogut llegir 'version' de assistent_ha/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Construint la versió ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare the build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ steps.meta.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./assistent_ha
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=Hermes
            io.hass.description=Assistent personal per Telegram amb veu i Gemini
          push: "true"
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish the multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
